<link rel="stylesheet" href="{{ url_for('views.themes', theme='duca-club', path='duca/landing.css') }}&v=7">

<section class="lp-hero" id="lp-hero">
  <canvas class="lp-canvas" id="lp-canvas" aria-hidden="true"></canvas>

  <div class="lp-hero-inner container">
    <img class="lp-logo" src="{{ url_for('views.themes', theme='duca-club', path='duca/duca.png') }}" alt="DUCA logo" draggable="false">

    <p class="lp-eyebrow">Deakin University Cybersecurity Association</p>
    <h1 class="lp-title">{{ Configs.ctf_name }}</h1>
    <p class="lp-sub">Capture the flag, free for everyone. Pick a challenge, break something, climb the board.</p>

    <div class="lp-cta">
      {% if authed() %}
        <a class="lp-btn lp-btn-primary" href="{{ url_for('challenges.listing') }}">Play challenges</a>
        <a class="lp-btn" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% else %}
        {% if registration_visible() %}
          <a class="lp-btn lp-btn-primary" href="{{ url_for('auth.register') }}">Join the CTF</a>
        {% endif %}
        <a class="lp-btn lp-btn-ghost" href="{{ url_for('scoreboard.listing') }}">Scoreboard</a>
      {% endif %}
    </div>

    <p class="lp-countdown" id="lp-countdown" hidden></p>
  </div>
</section>
